name: secret-scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Quét secret hardcode
        run: |
          chmod +x scripts/scan-secrets.sh
          ./scripts/scan-secrets.sh
